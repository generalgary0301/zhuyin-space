<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>原型 A・太空冒險地圖</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;background:#070b2a;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{background:#050820}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 80%,#fff8 50%,transparent 51%),radial-gradient(2px 2px at 40% 60%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 20%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 10% 85%,#fff9 50%,transparent 51%);background-size:300px 300px;animation:tw 6s linear infinite}
.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(1200px 800px at 50% 110%,#2b1d6b 0,#0b1240 45%,#050820 100%)}
@keyframes tw{to{background-position:0 300px}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#050820cc;backdrop-filter:blur(6px)}
.pill{background:#ffffff1f;border-radius:999px;padding:6px 14px;font-size:20px;font-weight:800;white-space:nowrap}
#starCount{display:inline-block;transition:transform .2s}.pop{transform:scale(1.35)!important}
.btn{border:none;border-radius:20px;font-size:22px;font-weight:800;padding:14px 22px;color:#1a1035;background:linear-gradient(135deg,#ffd166,#ff9f43);box-shadow:0 6px 0 #b86b16}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b86b16}
.btn.ghost{background:#ffffff22;color:#fff;box-shadow:none}
.screen{display:none;min-height:calc(100vh - 60px);padding:10px 14px 30px;position:relative;z-index:1}
.screen.on{display:block}
h1{font-size:28px;text-align:center;margin:8px 0}
.muted{opacity:.75;font-size:16px}
/* 地圖 */
#map{position:relative;max-width:620px;margin:0 auto;height:1040px}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.planet{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:none;font-size:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 6px #ffffff18,0 10px 30px #0008;animation:float 4s ease-in-out infinite}
.planet b{font-size:16px;margin-top:2px;text-shadow:0 2px 4px #0009}
.planet.locked{filter:grayscale(.9) brightness(.6)}
.planet.locked::after{content:'🔒';position:absolute;right:-4px;top:-4px;font-size:30px}
.planet.done::after{content:'✅';position:absolute;right:-4px;top:-4px;font-size:28px}
.planet.next{box-shadow:0 0 0 6px #ffd166,0 0 40px #ffd166aa}
.label{position:absolute;transform:translate(-50%,0);font-size:16px;font-weight:800;background:#0009;padding:3px 10px;border-radius:12px;white-space:nowrap}
@keyframes float{50%{transform:translateY(-8px)}}
#hero{position:absolute;font-size:56px;margin:-138px 0 0 -28px;transition:left 1s ease-in-out,top 1s ease-in-out;z-index:5;filter:drop-shadow(0 6px 8px #0009)}
#hero.walk{animation:hop .25s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px) rotate(6deg)}}
.bubble{position:absolute;background:#fff;color:#222;border-radius:16px;padding:8px 12px;font-size:17px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);z-index:6}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;padding:12px 18px;border-radius:16px;font-size:19px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90vw}
.toast.on{opacity:1}
/* 遊戲共用 */
.track{position:relative;height:74px;margin:6px 0 10px;background:#ffffff12;border-radius:40px}
.track .dots{position:absolute;left:46px;right:60px;top:50%;height:4px;background:repeating-linear-gradient(90deg,#fff6 0 10px,transparent 10px 20px)}
.track .goal{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:42px}
#rocket{position:absolute;left:6px;top:50%;font-size:46px;transform:translateY(-50%) rotate(45deg);transition:left .9s cubic-bezier(.5,-0.3,.4,1.4)}
#rocket.boost::after{content:'🔥';position:absolute;left:-26px;top:22px;font-size:30px;transform:rotate(-45deg)}
.card{background:#ffffff14;border-radius:28px;padding:16px;text-align:center}
.emo{font-size:96px;line-height:1.1}
.word{font-size:64px;font-weight:900;letter-spacing:6px;margin:4px 0}
.hl{color:#ffd166;border-bottom:6px solid #ffd166}
.say{font-size:22px;padding:10px 20px;border-radius:999px;border:none;background:#4dabf7;color:#fff;font-weight:800}
.dock{margin:16px auto 8px;width:200px;height:120px;border-radius:30px;border:4px dashed #ffd16699;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ffd166;text-align:center;transition:all .2s}
.dock.over{background:#ffd16633;border-color:#ffd166;transform:scale(1.06)}
.tiles{display:flex;gap:22px;justify-content:center;margin-top:10px}
.tile{width:130px;height:130px;border-radius:30px;background:linear-gradient(160deg,#fff,#dfe6ff);color:#1b1f4b;font-size:80px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #9aa6e0;position:relative;z-index:3}
.tile.dragging{z-index:30;box-shadow:0 16px 30px #0008}
.tile.bad{animation:shake .4s;background:#ffc9c9}
.tile.good{background:#b2f2bb}
.flyer{position:fixed;font-size:40px;z-index:60;transition:transform .7s cubic-bezier(.3,.7,.4,1),opacity .7s;pointer-events:none}
.confetti{position:fixed;top:-40px;font-size:30px;z-index:60;animation:fall 2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.hint{text-align:center;font-size:19px;min-height:28px;margin-top:6px}
/* 數學 */
.eq{font-size:56px;font-weight:900;text-align:center;margin:4px 0}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:10px auto;padding:12px;background:#ffffff18;border-radius:22px}
.slot{aspect-ratio:1;border-radius:50%;border:3px dashed #ffffff55;display:flex;align-items:center;justify-content:center}
.slot.over{background:#ffd16655}
.frame.full10{box-shadow:0 0 0 5px #ffd166,0 0 30px #ffd166aa}
.dot{width:100%;height:100%;border-radius:50%}
.dot.r{background:radial-gradient(circle at 35% 35%,#ff8787,#e03131)}
.dot.b{background:radial-gradient(circle at 35% 35%,#74c0fc,#1c7ed6)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;max-width:420px;margin:6px auto;padding:10px;border-radius:22px;background:#1c7ed622}
.tray .ball{width:60px;height:60px;position:relative;z-index:3}
.rest{display:flex;gap:8px;justify-content:center;min-height:60px}
.rest .ball{width:52px;height:52px}
.answers{display:flex;gap:16px;justify-content:center;margin-top:12px}
.ans{width:104px;height:104px;border-radius:50%;border:none;font-size:46px;font-weight:900;background:linear-gradient(160deg,#fff,#e7f5ff);color:#123;box-shadow:0 8px 0 #8fb3d9}
.ans.bad{background:#ffc9c9;animation:shake .4s}.ans.good{background:#b2f2bb}
.ten{text-align:center;font-size:24px;font-weight:900;color:#ffd166;min-height:34px}
.info{max-width:620px;margin:10px auto;background:#ffffff12;border-radius:20px;padding:12px 16px;font-size:16px;line-height:1.6}
.result{text-align:center;padding-top:30px}
.result .big{font-size:110px}
.stars3{font-size:60px;letter-spacing:8px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@media (min-width:700px){.word{font-size:84px}.emo{font-size:130px}.tile{width:170px;height:170px;font-size:104px}.ans{width:130px;height:130px;font-size:58px}.frame,.tray{max-width:520px}}
</style></head>
<body><div class="sky"></div><div class="stars"></div>
<header><button class="btn ghost" id="home" style="font-size:18px;padding:8px 14px;white-space:nowrap">🗺️ 地圖</button><span class="pill" style="font-size:16px">原型 A・冒險地圖</span><span class="pill">⭐ <span id="starCount">0</span></span></header>

<section class="screen on" id="s-map">
  <h1>👨‍🚀 律恩的太空冒險</h1>
  <p class="muted" style="text-align:center;margin:0">從最下面出發！點發亮的星球，小太空人就會飛過去 🚀</p>
  <div id="map"></div>
  <div class="info">🔒 依順序解鎖：完成下面的星球，上面的才會打開（原型裡第 2、3 顆先開放試玩）。<br>📱 每台裝置各自存檔；⏱ 正式版每題 6 秒、闖 3 次拿 1 顆星，規則沿用現在的網站。<br><a href="../proto-b/" style="color:#ffd166">→ 看原型 B（互動繪本／遊戲卡）</a>　<a href="../" style="color:#9ad">正式網站</a></div>
</section>

<section class="screen" id="s-zy">
  <div class="track"><div class="dots"></div><span id="rocket">🚀</span><span class="goal">🪐</span></div>
  <div class="card"><div class="emo" id="zEmo"></div><div class="word" id="zWord"></div>
    <button class="say" id="zSay">🔊 再聽一次</button>
    <p class="muted" style="margin:10px 0 0">黃色的字是哪個聲音？<b>把注音拖進火箭</b>（或點一下）</p></div>
  <div class="dock" id="dock">🚀 火箭燃料口<br>拖到這裡</div>
  <div class="tiles" id="tiles"></div>
  <div class="hint" id="zHint"></div>
</section>

<section class="screen" id="s-math">
  <div class="track"><div class="dots"></div><span id="rocket2" style="position:absolute;left:6px;top:50%;font-size:46px;transform:translateY(-50%) rotate(45deg);transition:left .9s cubic-bezier(.5,-0.3,.4,1.4)">🚀</span><span class="goal">🌕</span></div>
  <div class="eq" id="mEq"></div>
  <p class="muted" style="text-align:center;margin:0" id="mTip">把藍色球拖進格子，先湊成 10！</p>
  <div class="frame" id="frame"></div>
  <div class="ten" id="ten"></div>
  <div class="tray" id="tray"></div>
  <div class="answers" id="answers"></div>
  <div class="hint" id="mHint"></div>
</section>

<section class="screen" id="s-done"><div class="result"><div class="big" id="dBig">🏆</div><h1 id="dTitle">闖關成功！</h1><div class="stars3" id="dStars"></div><p class="muted" id="dSub"></p>
  <div class="row"><button class="btn" id="dMap">🗺️ 回地圖</button><button class="btn ghost" id="dAgain">🔁 再玩一次</button></div></div></section>
<div class="toast" id="toast"></div>
<script src="../js/data.js?v=11"></script>
<script src="../proto-shared/zy.js?v=1"></script>
<script>
(function(){
var Z=window.ZYP2,$=function(id){return document.getElementById(id);};
var stars=0,started=false;
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove('on');},1800);}
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on',s.id===id);});window.scrollTo(0,0);}
function addStar(from){Z.fly(from,$('starCount'),'⭐',function(){stars++;$('starCount').textContent=stars;});}
// ---------- 地圖（由下往上） ----------
var NODES=[
 {x:30,y:92,emo:'✍️',name:'筆順基地',st:'done',col:'#845ef7'},
 {x:70,y:74,emo:'🐷',name:'ㄓㄗ 星',st:'next',col:'#ff922b',go:'zy'},
 {x:32,y:56,emo:'🧮',name:'進位星',st:'open',col:'#20c997',go:'math'},
 {x:68,y:38,emo:'📚',name:'部首星系',st:'locked',col:'#339af0'},
 {x:42,y:18,emo:'👑',name:'大考驗',st:'locked',col:'#f06595'}];
var heroAt=0;
function drawMap(){var m=$('map');var pts=NODES.map(function(n){return n.x+','+n.y;}).join(' ');
  var h='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#ffffff55" stroke-width="1.2" stroke-dasharray="2 2" vector-effect="non-scaling-stroke" style="stroke-width:6px"/></svg>';
  NODES.forEach(function(n,i){h+='<button class="planet '+n.st+'" data-i="'+i+'" style="left:'+n.x+'%;top:'+n.y+'%;background:radial-gradient(circle at 35% 30%,'+n.col+'ee,'+n.col+'88 60%,#0006)">'+n.emo+'<b>'+(i+1)+'</b></button><div class="label" style="left:'+n.x+'%;top:calc('+n.y+'% + 66px)">'+n.name+(n.st==='next'?' 👉':'')+'</div>';});
  h+='<div id="hero" style="left:'+NODES[heroAt].x+'%;top:'+NODES[heroAt].y+'%">👨‍🚀</div>';
  m.innerHTML=h;
  m.querySelectorAll('.planet').forEach(function(b){b.onclick=function(){tapPlanet(+b.getAttribute('data-i'),b);};});
  setTimeout(function(){var nx=m.querySelector('.planet.next');if(nx)nx.scrollIntoView({block:'center',behavior:'smooth'});},200);}
function tapPlanet(i,b){if(!started){Z.unlock();started=true;}
  var n=NODES[i];
  if(n.st==='locked'){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('🔒 先完成下面的星球才能去喔！');return;}
  if(n.st==='done'&&!n.go){toast('✅ 這顆星球已經完成了！');return;}
  var hero=$('hero');hero.classList.add('walk');hero.style.left=n.x+'%';hero.style.top=n.y+'%';heroAt=i;
  setTimeout(function(){hero.classList.remove('walk');if(n.go==='zy')startZy();else if(n.go==='math')startMath();},1050);}
// ---------- 國語：ㄓ／ㄗ 聽音拖進火箭 ----------
var ZW={'ㄓ':['小豬','時鐘','章魚','蠟燭','照片','煮飯','手指','樹枝'],'ㄗ':['嘴巴','足球','洗澡','紫色','鑽石','走路','寫字','帽子']};
var zq=[],zi=0,zFirst=0,zMiss=false;
function wordsOf(s){var all=Z.pairWords(s);return all.filter(function(w){return ZW[s].indexOf(w.word)>=0;});}
function startZy(){zq=Z.shuffle(Z.pick(wordsOf('ㄓ'),3).concat(Z.pick(wordsOf('ㄗ'),2)));zi=0;zFirst=0;$('rocket').style.left='6px';show('s-zy');nextZy();}
function nextZy(){if(zi>=zq.length)return done('zy');var w=zq[zi];zMiss=false;
  $('zEmo').textContent=w.emoji;$('zWord').innerHTML=Z.hl(w);$('zHint').textContent='';
  var t=$('tiles');t.innerHTML='';Z.shuffle(['ㄓ','ㄗ']).forEach(function(s){var d=document.createElement('div');d.className='tile';d.textContent=s;t.appendChild(d);
    Z.drag(d,function(){return [$('dock')];},function(){return check(d,s);},function(){check(d,s);});});
  setTimeout(function(){Z.play(w.aud);},350);}
function check(el,s){var w=zq[zi];if(el.classList.contains('done'))return true;
  if(s===w.sound){el.classList.add('good','done');el.style.transform='';var dk=$('dock');dk.textContent='';dk.appendChild(el);
    if(!zMiss)zFirst++;zi++;var r=$('rocket');r.classList.add('boost');r.style.left='calc('+(zi/zq.length)+' * (100% - 110px) + 6px)';
    $('zHint').textContent=['答對了！火箭加速 🚀','好厲害！','太棒了！'][zi%3];Z.play('m_ok');addStar(el);
    setTimeout(function(){r.classList.remove('boost');var dk=$('dock');dk.innerHTML='🚀 火箭燃料口<br>拖到這裡';nextZy();},1500);return true;}
  zMiss=true;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');$('zHint').textContent='🤔 再聽一次，仔細聽黃色的字';setTimeout(function(){Z.play(w.aud);},400);return false;}
$('zSay').onclick=function(){Z.play(zq[zi].aud);};
// ---------- 數學：湊十（進位加法），拖球進十格 ----------
var mq=[],mi=0,mFirst=0,mMiss=false,filled=0;
function startMath(){mq=Z.mathQ(3,6,9).map(function(q){return q;});mi=0;mFirst=0;$('rocket2').style.left='6px';show('s-math');nextMath();}
function nextMath(){if(mi>=mq.length)return done('math');var q=mq[mi];mMiss=false;filled=q.a;
  $('mEq').textContent=q.a+' ＋ '+q.b+' ＝ ？';$('mTip').textContent='把藍色球拖進格子（或點一下），先湊成 10！';$('ten').textContent='';$('answers').innerHTML='';$('mHint').textContent='';
  var f=$('frame');f.innerHTML='';f.classList.remove('full10');for(var i=0;i<10;i++){var s=document.createElement('div');s.className='slot';if(i<q.a)s.innerHTML='<div class="dot r"></div>';f.appendChild(s);}
  var t=$('tray');t.innerHTML='';for(var j=0;j<q.b;j++){var b=document.createElement('div');b.className='ball';b.innerHTML='<div class="dot b"></div>';t.appendChild(b);(function(b){
    Z.drag(b,function(){return [].slice.call(document.querySelectorAll('#frame .slot:not(.full)')).filter(function(s){return !s.firstChild;});},function(slot){return putBall(b,slot);},function(){var s=[].slice.call(document.querySelectorAll('#frame .slot')).filter(function(s){return !s.firstChild;})[0];if(s)putBall(b,s);});})(b);}
  Z.play(Z.numIds(q.a).concat(['m_plus']).concat(Z.numIds(q.b)).concat(['m_eqq']));}
function putBall(b,slot){if(filled>=10||slot.firstChild)return false;b.style.transform='';b.classList.add('done');slot.appendChild(b.firstChild);b.remove();filled++;
  if(filled===10){var q=mq[mi];var rest=q.s-10;$('ten').textContent='🎉 湊成 10！還剩 '+rest+' 個';$('frame').classList.add('full10');Z.play(['m_cou10']);
    document.querySelectorAll('#tray .ball').forEach(function(x){x.classList.add('done');x.style.opacity='.95';});
    $('mTip').textContent='10 和 '+rest+' 合起來是多少？點答案！';setTimeout(function(){answers(q);},600);}
  return true;}
function answers(q){var opts=Z.shuffle([q.s,q.s-1,q.s+1].filter(function(v,i,a){return a.indexOf(v)===i;}));var a=$('answers');a.innerHTML='';
  opts.forEach(function(v){var b=document.createElement('button');b.className='ans';b.textContent=v;a.appendChild(b);b.onclick=function(){
    if(v===q.s){b.classList.add('good');if(!mMiss)mFirst++;mi++;$('rocket2').style.left='calc('+(mi/mq.length)+' * (100% - 110px) + 6px)';$('mHint').textContent='答對了！'+q.a+' ＋ '+q.b+' ＝ '+q.s;
      Z.play(['m_ok'].concat(Z.numIds(q.a)).concat(['m_plus']).concat(Z.numIds(q.b)).concat(['m_eq']).concat(Z.numIds(q.s)));addStar(b);setTimeout(nextMath,3600);}
    else{mMiss=true;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('mHint').textContent='再想想：10 再加 '+(q.s-10)+' 是多少？';Z.play('m_try');}};});}
// ---------- 結果 ----------
var last='zy';
function done(k){last=k;var n=k==='zy'?zq.length:mq.length,f=k==='zy'?zFirst:mFirst;Z.confetti(30);
  $('dBig').textContent=k==='zy'?'🪐':'🌕';$('dTitle').textContent=k==='zy'?'抵達 ㄓㄗ 星！':'登陸進位星！';
  $('dStars').textContent='⭐'+(f===n?'⭐⭐':'☆☆');$('dSub').textContent='第一次就答對 '+f+' / '+n+' 題・正式版：同一關闖 3 次（題目不重複）拿 1 顆星';
  if(k==='zy'){NODES[1].st='done';NODES[2].st='next';heroAt=1;}else{NODES[2].st='done';heroAt=2;}
  Z.play(f===n?'m_done':'m_done2');show('s-done');}
$('dMap').onclick=function(){drawMap();show('s-map');};$('home').onclick=function(){Z.stop();drawMap();show('s-map');};
$('dAgain').onclick=function(){if(last==='zy')startZy();else startMath();};
drawMap();
window.PA={startZy:startZy,startMath:startMath,get zq(){return zq;},get zi(){return zi;},get mq(){return mq;},get mi(){return mi;},check:check};
})();
</script></body></html>
